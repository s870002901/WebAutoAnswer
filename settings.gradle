pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Xposed API 82 不在 Maven Central，需走官方仓库
        maven { url 'https://api.xposed.info/' }
    }
}

rootProject.name = "WebAutoAnswer"
include ':app'
